# ---- Database (MySQL) ----
# Put your MySQL password below, or set the DB_PASSWORD environment variable
# (start-backend.bat asks for it). The database is created automatically.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.error.include-message=always

# ---- Admin login (change before real use) ----
village.admin.username=admin
village.admin.password=admin123
