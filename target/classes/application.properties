# ---- Database (MySQL) ----
# Put your MySQL password below, or set the DB_PASSWORD environment variable
# (start-backend.bat asks for it). The database is created automatically.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:village_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
server.error.include-message=always

# ---- Admin login (change before real use) ----
village.admin.username=admin
village.admin.password=admin123
